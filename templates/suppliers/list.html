{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Suppliers</h2><a class="btn btn-primary" href="{{ url_for('suppliers.add') }}">Add supplier</a></div>
<table class="table table-striped mt-3"><tr><th>Name</th><th>Phone</th><th>Email</th></tr>
{% for s in suppliers %}<tr><td>{{ s.supplier_name }}</td><td>{{ s.phone or '-' }}</td><td>{{ s.email or '-' }}</td></tr>{% else %}<tr><td colspan="3">No suppliers yet.</td></tr>{% endfor %}</table>{% endblock %}
